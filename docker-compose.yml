services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U crm"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "ping"], interval: 10s, timeout: 5s, retries: 10}
  api:
    build: .
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    environment: &env
      DATABASE_URL: postgresql+asyncpg://crm:crm@postgres:5432/crm
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET_KEY: change-this-secret-in-production
      ADMIN_SETUP_TOKEN: local-admin-setup-token
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: .
    volumes:
      - ./app:/app/app
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      api: {condition: service_started}
    command: python -m app.workers.runner
  outbox-publisher:
    build: .
    volumes:
      - ./app:/app/app
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      api: {condition: service_started}
    command: python -m app.workers.outbox_publisher
