[project]
name = "cloud-resource-management"
version = "0.1.0"
dependencies = [
  "fastapi>=0.111", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29",
  "alembic>=1.13", "pydantic-settings>=2.3", "passlib[bcrypt]>=1.7", "python-jose[cryptography]>=3.3",
  "redis>=5.0", "aio-pika>=9.4", "email-validator>=2.1", "python-multipart>=0.0.9", "structlog>=24.1"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "aiosqlite>=0.19", "ruff>=0.5"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
asyncio_mode = "auto"
